name: Refresh profile statistics

on:
  schedule:
    - cron: "43 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/update-stats.mjs
      - scripts/update-stats.test.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: read

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jobayerhassan/jobayerhassan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test statistics and rendering rules
        run: node --test scripts/update-stats.test.mjs

      - name: Generate statistics from GitHub
        run: node scripts/update-stats.mjs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-stats.svg assets/top-languages.svg
          if git diff --cached --quiet; then
            echo "Statistics cards are already current."
            exit 0
          fi
          git commit -m "chore: refresh GitHub profile statistics"
          git pull --rebase origin main
          git push origin HEAD:main
